global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "ai_gateway"
    metrics_path: "/metrics"
    static_configs:
      # Running natively on Mac - FastAPI is on localhost:8000
      - targets: ["localhost:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "ai_gateway_local"
